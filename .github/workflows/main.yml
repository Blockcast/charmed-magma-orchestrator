name: main-branch

on:
  # Use the base-branch workflow for PR admission so runner selection is not
  # controlled by an untrusted fork.
  pull_request_target:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  orchestrator-lint-report:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository
    name: Lint report
    runs-on: arc-magma
    steps:
      - uses: actions/checkout@v2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install tox
        run: |
          python3 -m venv "$RUNNER_TEMP/tox"
          "$RUNNER_TEMP/tox/bin/pip" install tox
          echo "$RUNNER_TEMP/tox/bin" >> "$GITHUB_PATH"
      - name: Run tests using tox
        run: |
          set -eux
          charms="$(find ./ -name tox.ini)"
          for charm in ${charms}; do
            tox -c "${charm}" -e lint
          done

  orchestrator-static-analysis:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository
    name: Static analysis
    runs-on: arc-magma
    steps:
      - uses: actions/checkout@v2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install tox
        run: |
          python3 -m venv "$RUNNER_TEMP/tox"
          "$RUNNER_TEMP/tox/bin/pip" install tox
          echo "$RUNNER_TEMP/tox/bin" >> "$GITHUB_PATH"
      - name: Run tests using tox
        run: |
          set -eux
          charms="$(find ./ -name tox.ini)"
          for charm in ${charms}; do
            tox -c "${charm}" -e static
          done

  orchestrator-unit-tests-with-coverage:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository
    name: Unit tests
    runs-on: arc-magma
    steps:
      - uses: actions/checkout@v2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install tox
        run: |
          python3 -m venv "$RUNNER_TEMP/tox"
          "$RUNNER_TEMP/tox/bin/pip" install tox
          echo "$RUNNER_TEMP/tox/bin" >> "$GITHUB_PATH"
      - name: Run tests using tox
        run: |
          set -eux
          charms="$(find ./ -name tox.ini  -not -path "./orc8r-bundle/*")"
          for charm in ${charms}; do
            tox -c "${charm}" -e unit
          done

  orchestrator-integration-test:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository
    name: Integration tests
    uses: ./.github/workflows/integration-tests-self-hosted.yml
    with:
      charm_dir: orc8r-bundle
