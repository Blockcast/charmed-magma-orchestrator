name: shared test utils

on:
  push:
    paths:
      - "shared_test_utils/**"

jobs:
  lint-report:
    runs-on: arc-magma
    steps:
      - uses: actions/checkout@v3
      - name: Install tox
        run: |
          python3 -m venv "$RUNNER_TEMP/tox"
          "$RUNNER_TEMP/tox/bin/pip" install tox
          echo "$RUNNER_TEMP/tox/bin" >> "$GITHUB_PATH"
      - name: Run tests using tox
        run: cd shared_test_utils && tox -e lint

  static-analysis:
    runs-on: arc-magma
    steps:
      - uses: actions/checkout@v3
      - name: Install tox
        run: |
          python3 -m venv "$RUNNER_TEMP/tox"
          "$RUNNER_TEMP/tox/bin/pip" install tox
          echo "$RUNNER_TEMP/tox/bin" >> "$GITHUB_PATH"
      - name: Run tests using tox
        run: cd shared_test_utils && tox -e static
