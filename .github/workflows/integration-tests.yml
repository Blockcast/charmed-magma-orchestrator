name: Integration Tests

on:
  workflow_call:
    inputs:
      charm_dir:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      charm_dir:
        description: Charm directory to test
        required: true
        type: string

jobs:
  integration-tests:
    timeout-minutes: 60
    if: github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set Environment Variables
        uses: tw3lveparsecs/github-actions-setvars@latest
        with:
          varFilePath: ./.github/variables/dependencies_versions.env
      - name: Setup operator environment
        uses: charmed-kubernetes/actions-operator@main
        with:
          provider: microk8s
          channel: ${{ env.MICROK8S_VERSION }}
          juju-channel: ${{ env.JUJU_VERSION }}
          juju-crashdump-channel: latest/stable
      - name: Configure hosted MicroK8s credentials
        run: |
          mkdir -p "$HOME/.kube"
          sudo microk8s config > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          echo "KUBECONFIG=$HOME/.kube/config" >> "$GITHUB_ENV"
      - name: Inspect Juju Kubernetes proxy credentials
        run: |
          namespace="controller-$CONTROLLER_NAME"
          secret="$(sudo microk8s kubectl -n "$namespace" get serviceaccount controller-proxy -o jsonpath='{.secrets[0].name}')"
          token_length="$(sudo microk8s kubectl -n "$namespace" get secret "$secret" -o jsonpath='{.data.token}' | base64 -d | wc -c)"
          token_length_from_juju="$(awk -F': ' '/service-account-token:/ {print length($2); exit}' "$HOME/.local/share/juju/controllers.yaml")"
          echo "Juju proxy service-account token bytes: $token_length_from_juju"
          echo "Kubernetes service-account token bytes: $token_length"
          token="$(sudo microk8s kubectl -n "$namespace" get secret "$secret" -o jsonpath='{.data.token}' | base64 -d)"
          sudo microk8s kubectl --token="$token" -n "$namespace" auth can-i get service/controller-service
      - name: Run integration tests
        run: cd ${{ inputs.charm_dir }} && tox -e integration
      - name: Archive charmcraft logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: charmcraft-logs
          path: /home/runner/.local/state/charmcraft/log/*.log
      - name: Archive juju crashdump
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: juju-crashdump
          path: ${{ inputs.charm_dir }}/juju-crashdump-*.tar.xz
